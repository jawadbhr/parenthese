<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parenthèse — Tes citations positives, chaque jour</title>
  <meta name="description" content="Parenthèse t'accompagne au quotidien avec des citations positives et des affirmations, directement sur ton écran.">
  <meta property="og:title" content="Parenthèse — Citations & affirmations positives">
  <meta property="og:description" content="Ta pause quotidienne : des citations qui te touchent, sur ton écran d'accueil.">
  <meta property="og:type" content="website">
  <style>
    :root{
      --cream:#F6F1E7; --cream-hi:#FBF7EF; --cream-lo:#EFE6D3;
      --ink:#1F1810; --body:#4a4034; --sub:#6B5D47;
      --gold:#B08A4A; --gold-soft:#C9A96E; --line:rgba(176,138,74,0.18);
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;}
    body{
      background:linear-gradient(180deg,var(--cream-hi) 0%,var(--cream) 55%,var(--cream-lo) 100%);
      color:var(--ink);
      font-family:Georgia,'Times New Roman',serif;
      -webkit-font-smoothing:antialiased;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      min-height:100svh;text-align:center;padding:36px 26px;
      overflow-x:hidden;
    }
    .halo{position:fixed;top:-240px;left:50%;transform:translateX(-50%);
      width:760px;height:760px;border-radius:50%;pointer-events:none;z-index:0;
      background:radial-gradient(circle,rgba(201,169,110,0.16) 0%,rgba(201,169,110,0) 65%);}

    @keyframes fadeUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:none;}}
    .fx{opacity:0;animation:fadeUp .7s ease forwards;position:relative;z-index:1;}
    .d1{animation-delay:.05s}.d2{animation-delay:.16s}.d3{animation-delay:.28s}
    .d4{animation-delay:.4s}.d5{animation-delay:.55s}

    .logo{width:92px;height:92px;border-radius:22px;
      box-shadow:0 12px 32px rgba(176,138,74,0.28);margin-bottom:26px;}
    h1{font-size:46px;font-weight:700;letter-spacing:.5px;line-height:1.05;}
    .h1sub{font-size:18px;color:var(--gold);font-style:italic;margin-top:4px;margin-bottom:20px;}
    .tagline{font-size:17.5px;color:var(--body);line-height:1.6;max-width:330px;margin:0 auto 22px;}
    .proof{margin-bottom:30px;}
    .stars{color:var(--gold-soft);font-size:17px;letter-spacing:3px;display:block;margin-bottom:6px;}
    .proof span{font-size:14px;color:var(--sub);}
    .proof b{color:var(--gold);}

    .store{display:inline-flex;align-items:center;gap:13px;background:#111;color:#fff;
      text-decoration:none;border-radius:15px;padding:14px 28px 14px 22px;
      font-family:-apple-system,'Segoe UI',Roboto,sans-serif;
      box-shadow:0 10px 26px rgba(31,24,16,0.25);
      transition:transform .18s ease;}
    .store:active{transform:scale(.97);}
    .store svg{width:30px;height:30px;fill:#fff;flex-shrink:0;}
    .store .lbl{text-align:left;}
    .store .lbl small{display:block;font-size:11px;opacity:.75;letter-spacing:.4px;}
    .store .lbl span{display:block;font-size:20px;font-weight:600;margin-top:1px;letter-spacing:.2px;}

    .foot{margin-top:44px;color:var(--sub);font-size:12.5px;position:relative;z-index:1;}
    .foot a{color:var(--gold);text-decoration:none;margin:0 8px;}
  </style>
</head>
<body>
  <div class="halo"></div>

  <img class="logo fx d1" src="logo.png" alt="Parenthèse">
  <h1 class="fx d2">Parenthèse</h1>
  <p class="h1sub fx d2">citations du jour</p>
  <p class="tagline fx d3">Tes citations positives et tes affirmations, chaque jour, directement sur ton écran.</p>
  <div class="proof fx d3">
    <span class="stars">★★★★★</span>
    <span><b>4,7 / 5</b> · plus de <b>10 000</b> téléchargements</span>
  </div>

  <a class="store fx d4" href="https://apps.apple.com/app/id6761851376">
    <svg viewBox="0 0 384 512" aria-hidden="true"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
    <span class="lbl"><small>Télécharger dans</small><span>l'App Store</span></span>
  </a>

  <footer class="foot fx d5">

  </footer>
</body>
</html>
